  <!-- Ticks -->
  <line x1="19" y1="72" x2="23" y2="64" stroke="#1C2B2D" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="50" y1="41" x2="50" y2="48" stroke="#1C2B2D" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  <line x1="81" y1="72" x2="77" y2="64" stroke="#1C2B2D" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

  <!-- CO₂ label -->
  <text x="50" y="90" text-anchor="middle"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="9" font-weight="600" fill="#1C2B2D" opacity="0.7" letter-spacing="0.5">CO₂</text>
