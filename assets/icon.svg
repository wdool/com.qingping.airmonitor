<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Gauge track (faint) -->
  <path d="M 19 72 A 31 31 0 0 1 81 72"
        fill="none" stroke="#1C2B2D" stroke-width="7" stroke-linecap="round" opacity="0.15"/>

  <!-- Gauge fill -->
  <path d="M 19 72 A 31 31 0 0 1 67 41"
        fill="none" stroke="#1C2B2D" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- Needle -->
