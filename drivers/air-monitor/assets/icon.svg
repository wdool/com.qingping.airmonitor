<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <!-- Device outline -->
  <rect x="10" y="14" width="80" height="72" rx="10"
        fill="none" stroke="#1C2B2D" stroke-width="2.5" opacity="0.9"/>

  <!-- Screen area -->
  <rect x="18" y="23" width="64" height="44" rx="5"
        fill="none" stroke="#1C2B2D" stroke-width="1.5" opacity="0.4"/>

  <!-- WiFi icon top-left -->
  <path d="M 23 19.5 Q 26 16.5 29 19.5" fill="none" stroke="#1C2B2D" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M 21 21.5 Q 26 14.5 31 21.5" fill="none" stroke="#1C2B2D" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <circle cx="26" cy="21" r="1.3" fill="#1C2B2D" opacity="0.9"/>

  <!-- Status dots top-center -->
  <circle cx="46" cy="19" r="1.2" fill="#1C2B2D" opacity="0.4"/>
  <circle cx="50" cy="19" r="1.2" fill="#1C2B2D" opacity="0.4"/>
  <circle cx="54" cy="19" r="1.2" fill="#1C2B2D" opacity="0.4"/>

  <!-- Battery top-right -->
  <rect x="68" y="16.5" width="14" height="6.5" rx="2"
        fill="none" stroke="#1C2B2D" stroke-width="1.5" opacity="0.7"/>
  <rect x="82" y="18.5" width="2" height="2.5" rx="0.5" fill="#1C2B2D" opacity="0.7"/>
  <rect x="69.5" y="18" width="8" height="3.5" rx="1" fill="#1C2B2D" opacity="0.5"/>

  <!-- Large reading -->
  <text x="50" y="54"
        text-anchor="middle"
        font-family="'SF Mono', 'Courier New', monospace"
        font-size="28" font-weight="700"
        fill="#1C2B2D" opacity="0.95">23</text>

  <!-- Sensor label -->
  <text x="50" y="63"
        text-anchor="middle"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="7.5" font-weight="500" letter-spacing="1.2"
        fill="#1C2B2D" opacity="0.6">PM2.5</text>

  <!-- Bottom indicator bar -->
  <rect x="40" y="91" width="20" height="2.5" rx="1.2" fill="#1C2B2D" opacity="0.25"/>
</svg>
